server:
  port: 8080

spring:
  application:
    name: "ms-authentication"
  main:
    web-application-type: reactive

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:db_auth_ms}
    username: ${DB_USER:dbeaver}
    password: ${DB_PASSWORD:12345}
    driver-class-name: org.postgresql.Driver

  r2dbc:
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:db_auth_ms}
    username: ${DB_USER:dbeaver}
    password: ${DB_PASSWORD:12345}
    pool:
      enabled: true

      max-acquire-time: 5s
      max-create-connection-time: 8s
      validation-query: "SELECT 1"

  # 3. Configuración de Flyway para ejecutar las migraciones
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# --- OTRAS CONFIGURACIONES ---
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  info:
    title: "Microservicio de Autenticación"
    description: "API REST para la gestión de usuarios, incluyendo registro y consulta."
    version: "1.0.0"

security:
  jwt:
    # Usa la variable de entorno JWT_SECRET, con un valor por defecto para desarrollo.
    secret: "${JWT_SECRET:EstaEsUnaClaveSecretaDeEjemploParaElRetoPragmaConMasDe256BitsDeLongitud}"
    expiration: 3600

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

